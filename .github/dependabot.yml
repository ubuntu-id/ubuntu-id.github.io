version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /themes/ubuntukr
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      theme-dependencies:
        patterns:
          - "*"
    ignore:
      # Vanilla 4 renames CSS classes and needs a visual check of every page.
      # Vanilla 3.15.1 is the last 3.x release.
      - dependency-name: vanilla-framework
        update-types:
          - version-update:semver-major
