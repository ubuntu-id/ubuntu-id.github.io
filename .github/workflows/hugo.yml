# Build the Hugo site and publish it to the gh-pages branch
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.147.9"
  SASS_VERSION: "1.89.2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Hugo
        run: |
          wget -q --tries=5 --waitretry=5 "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -O hugo.deb
          sudo dpkg -i hugo.deb
          rm hugo.deb

      - name: Install Dart Sass
        run: |
          wget -q --tries=5 --waitretry=5 "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz" -O dart-sass.tar.gz
          sudo tar -C /opt -xzf dart-sass.tar.gz
          sudo ln -s /opt/dart-sass/sass /usr/local/bin/sass
          rm dart-sass.tar.gz
          sass --version

      - name: Install theme dependencies
        working-directory: themes/ubuntukr
        run: npm ci

      - name: Build
        run: hugo --minify

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          cname: ubuntu-id.org
