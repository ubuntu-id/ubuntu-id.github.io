{{ define "main" }}


<main>
  <section class="p-strip--{{.Params.backgroundType}} main-strip"
    {{if eq .Params.backgroundType "image"}}
    {{ with .Resources.Get .Params.backgroundImage }}style="background-image:url('{{ .RelPermalink }}')"{{ end }}
    {{end}}>
      <div class="row">
        {{if eq .Params.backgroundType "image"}}
        <div class="col-6 col-start-large-7 right-section">
          <div class="p-card--overlay">
            {{ with .Resources.Get .Params.image }}<img src="{{ .RelPermalink }}" alt="" style="padding: 20px">{{ end }}
            <h2>{{.Title}}</h2>
            <p class="p-card__content">{{.Params.description}}</p>
          </div>
        </div>
        {{else}}
        <div class="col-8 left-section">
          <h1>{{.Title}}</h1>
          <p>{{.Params.description}}</p>
        </div>
        <div class="col-4 right-section">
          {{ with .Resources.Get .Params.image }}<img src="{{ .RelPermalink }}" alt="">{{ end }}
        </div>
        {{end}}
      </div>
  </section>
  <section class="p-strip">
  <div class="row">
  {{ .Content }}
  </div>
  </section>
</main>
{{ end }}
