name = "Ubuntukr"
license = "MIT"
licenselink = "https://github.com/ubuntu-id/ubuntu-id.github.io/blob/main/themes/ubuntukr/LICENSE"
description = "Vanilla Framework based theme for the Ubuntu Indonesia Community website."
homepage = "https://ubuntu-id.org"
tags = ["community", "multilingual"]
features = ["multilingual"]
min_version = "0.128.0"

[author]
  name = "Ubuntu Indonesia Community"
  homepage = "https://ubuntu-id.org"

[original]
  name = "Ubuntu Korea Community"
  homepage = "https://ubuntu-kr.org"
  repo = "https://github.com/ubuntu-kr/ubuntu-kr.github.io"

[module]
  [[module.mounts]]
    source = "node_modules"
    target = "assets/node_modules"
